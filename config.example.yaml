# Copy this file to config.yaml (git-ignored) and adjust. Anything left out uses the
# built-in defaults from src/mtg_wizard/config.py.

preferences:
  languages: [en, fr]          # accepted card languages
  min_condition: EX            # MT, NM, EX, GD, LP, PL, PO
  allow_foil: true             # foils accepted when they are the cheaper option
  respect_requested_printing: false   # true = only the (SET) written in the decklist
  unknown_language_ok: true    # some shops (Troll2Jeux) do not state language/condition
  unknown_condition_ok: true

solver:
  time_limit_s: 120
  max_sellers: null            # e.g. 5 to receive at most 5 parcels / visit at most 5 shops
  include_estimates: true      # Cardmarket/TCGplayer price-guide estimates for cards with no real listing
  missing_card_penalty_eur: 500

currency:
  usd_to_eur: null             # null = today's ECB rate

providers:
  # ---- Paris shops: pick-up in store, no shipping. visit_cost_eur puts a price on each trip.
  playin:
    enabled: true
    visit_cost_eur: 0
    card_ids:                  # Play-in's sitemap is incomplete: pin missing cards here
      "Sol Ring": 9710         # (number from https://www.play-in.com/fr/carte/<number>/...)
  parkage:
    enabled: true
    visit_cost_eur: 0
  troll2jeux:
    enabled: true
    visit_cost_eur: 0
    default_language: fr
  csv:                         # manual offers, e.g. prices seen in a shop without a website
    enabled: true
    files: []                  # e.g. [offers/example_manual.csv]

  # ---- Online
  cardmarket:
    enabled: true
    modes: [priceguide, saved_pages]
    priceguide_field: trend    # low | trend | avg | avg7 | avg30
    saved_pages_dir: cardmarket_pages
    # Delivery to Paris, tiers: [max cards, EUR] = national post 2026 + Cardmarket packaging fee
    # (20 g letter = 4 cards, 50 g = 17, 100 g = 40). Tracked is mandatory above 25 EUR.
    shipping_by_country:
      FR: {tiers: [[4, 1.82], [40, 3.40], [100, 5.74], [200, 7.91], [400, 9.79], [100000, 11.64]],
           tracked_above_eur: 25, tracked_extra_eur: 0.70}      # La Poste 2026
      DE: {tiers: [[4, 1.55], [17, 2.10], [40, 3.60], [200, 3.80], [400, 7.00], [100000, 17.50]],
           tracked_above_eur: 25, tracked_extra_eur: 3.90}      # Deutsche Post 09/2026
      default: {tiers: [[4, 2.2], [17, 3.6], [40, 6.5], [400, 14.0], [100000, 20.0]],
                tracked_above_eur: 25, tracked_extra_eur: 4.0}  # other countries: rough estimate
  cardkingdom:
    enabled: false               # shipping to the EU paused since Nov 2026
    shipping: {tiers: [[20, 15.0], [60, 22.0], [100000, 35.0]], import_vat_rate: 0.25, customs_fee_eur: 3.0}
  tcgplayer:
    enabled: true
    shipping: {tiers: [[10, 7.0], [40, 12.0], [100000, 20.0]], import_vat_rate: 0.20, customs_fee_eur: 3.0}
